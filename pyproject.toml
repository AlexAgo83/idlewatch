[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "idlewatch"
dynamic = ["version"]
description = "Read-only decoder for Melvor Idle 2 saves: header, skills, bank and wallet as JSON."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexandre Agostini" }]
requires-python = ">=3.11"
dependencies = ["brotli"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://github.com/AlexAgo83/idlewatch"

[project.scripts]
idlewatch = "idlewatch.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.version]
path = "src/idlewatch/__init__.py"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
